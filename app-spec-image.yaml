name: rawrz-security-platform
region: nyc1

services:
- name: api
  image:
    registry_type: DOCKER_HUB
    registry: node
    repository: node
    tag: "18-alpine"
  
  run_command: |
    apk add --no-cache curl &&
    mkdir -p /app && cd /app &&
    cat > package.json << 'EOF'
    {
      "name": "rawrz-optimized",
      "version": "1.0.0",
      "dependencies": {
        "express": "^4.18.2",
        "cors": "^2.8.5",
        "helmet": "^7.1.0",
        "compression": "^1.7.4",
        "express-rate-limit": "^7.1.5"
      }
    }
    EOF
    &&
    npm install --only=production &&
    cat > server.js << 'EOF'
    const express = require('express');
    const cors = require('cors');
    const helmet = require('helmet');
    const compression = require('compression');
    const rateLimit = require('express-rate-limit');
    
    const app = express();
    const port = process.env.PORT || 8080;
    
    app.use(helmet());
    app.use(compression());
    app.use(cors());
    app.use(express.json({ limit: '10mb' }));
    
    const limiter = rateLimit({
      windowMs: 15 * 60 * 1000,
      max: 1000
    });
    app.use(limiter);
    
    app.get('/health', (req, res) => {
      res.json({
        status: 'healthy',
        timestamp: new Date().toISOString(),
        uptime: process.uptime(),
        memory: process.memoryUsage()
      });
    });
    
    app.get('/', (req, res) => {
      res.json({
        message: 'RawrZ Security Platform - Optimized',
        version: '2.0.0',
        status: 'running'
      });
    });
    
    app.get('/api', (req, res) => {
      res.json({
        message: 'API is running',
        endpoints: ['/', '/health', '/api', '/api/status']
      });
    });
    
    app.get('/api/status', (req, res) => {
      res.json({
        server: {
          status: 'running',
          uptime: process.uptime(),
          memory: process.memoryUsage()
        }
      });
    });
    
    const server = app.listen(port, '0.0.0.0', () => {
      console.log(`RawrZ Platform running on port ${port}`);
    });
    EOF
    &&
    node server.js
  
  instance_count: 1
  instance_size_slug: basic-xxs
  
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8080"
  - key: NODE_OPTIONS
    value: "--max-old-space-size=128"
    
  health_check:
    http_path: /health
    
  routes:
  - path: /
    
  alerts:
  - rule: CPU_UTILIZATION
    disabled: false
    window: FIVE_MINUTES
  - rule: MEM_UTILIZATION  
    disabled: false
    window: FIVE_MINUTES