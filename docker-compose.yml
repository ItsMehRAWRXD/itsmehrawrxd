version: '3.8'

services:
  # RawrZ Security Platform - 1GB Optimized
  rawrz-app:
    build: .
    container_name: rawrz-security-platform
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./generated-stubs:/app/generated-stubs
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MAX_FILE_SIZE=500MB
      - LOG_LEVEL=warn
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s