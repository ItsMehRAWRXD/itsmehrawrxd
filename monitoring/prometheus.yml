global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'n0mn0m-system'
    static_configs:
      - targets: ['n0mn0m-system:3000']
    scrape_interval: 10s
    metrics_path: '/api/system/stats'
    params:
      format: ['prometheus']