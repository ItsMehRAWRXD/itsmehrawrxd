# Promtail Configuration for RawrZ Security Platform
# Collects logs from application and ships to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://rawrz-logs:3100/loki/api/v1/push

scrape_configs:
  - job_name: rawrz-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rawrz-app
          __path__: /var/log/rawrz/app-*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            container: container_name
      
      - timestamp:
          source: timestamp
          format: RFC3339
      
      - labels:
          level:
          service:
          container:

  - job_name: rawrz-processor-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rawrz-processor
          __path__: /var/log/rawrz/processor-*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            container: container_name
      
      - timestamp:
          source: timestamp
          format: RFC3339
      
      - labels:
          level:
          service:
          container:

  - job_name: rawrz-bots-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rawrz-bots
          __path__: /var/log/rawrz/bots-*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            container: container_name
      
      - timestamp:
          source: timestamp
          format: RFC3339
      
      - labels:
          level:
          service:
          container:

  - job_name: rawrz-nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rawrz-nginx
          __path__: /var/log/rawrz/nginx-*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<request_uri>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      
      - timestamp:
          source: time_local
          format: 02/Jan/2006:15:04:05 -0700
      
      - labels:
          method:
          status:
          remote_addr:

  - job_name: rawrz-system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rawrz-system
          __path__: /var/log/rawrz/system-*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            component: component
      
      - timestamp:
          source: timestamp
          format: RFC3339
      
      - labels:
          level:
          component: