name: 🚀 Deploy to Digital Ocean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '18'

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🧪 Run tests
      run: npm test
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: 🔍 Run linting
      run: npm run lint || true

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results.xml
          coverage/
        retention-days: 30

  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.force_deploy == 'true')
    
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📋 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: 📝 Output image
      id: image
      run: |
        echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    
    steps:
    - name: 🔍 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📊 Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: |
      always() && 
      needs.build.result == 'success' && 
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    environment: staging
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: 📋 Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.DO_STAGING_HOST }} >> ~/.ssh/known_hosts

    - name: 🚀 Deploy to staging server
      run: |
        ssh root@${{ secrets.DO_STAGING_HOST }} << 'EOF'
          cd /opt/rawrz-security
          git pull origin main
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          docker image prune -f
        EOF

    - name: 🏥 Health check
      run: |
        sleep 30
        curl -f https://${{ secrets.DO_STAGING_HOST }}/api/health || exit 1

  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security-scan, deploy-staging]
    if: |
      always() && 
      needs.build.result == 'success' && 
      needs.deploy-staging.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.environment == 'production')
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DO_SSH_KEY }}

    - name: 📋 Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.DO_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: 💾 Backup production data
      run: |
        ssh root@${{ secrets.DO_PRODUCTION_HOST }} << 'EOF'
          /opt/backup-rawrz.sh
        EOF

    - name: 🚀 Deploy to production server
      run: |
        ssh root@${{ secrets.DO_PRODUCTION_HOST }} << 'EOF'
          cd /opt/rawrz-security
          
          # Create backup of current deployment
          cp docker-compose.yml docker-compose.yml.backup
          
          # Pull latest changes
          git pull origin main
          
          # Update images
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
          # Rolling update with zero downtime
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps rawrz-app
          sleep 10
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps rawrz-processor
          sleep 10
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps rawrz-bots
          
          # Clean up old images
          docker image prune -f
        EOF

    - name: 🏥 Production health check
      run: |
        sleep 60
        for i in {1..5}; do
          if curl -f https://${{ secrets.DO_PRODUCTION_HOST }}/api/health; then
            echo "Health check passed"
            break
          else
            echo "Health check failed, attempt $i/5"
            if [ $i -eq 5 ]; then
              echo "All health checks failed, rolling back..."
              ssh root@${{ secrets.DO_PRODUCTION_HOST }} << 'EOF'
                cd /opt/rawrz-security
                cp docker-compose.yml.backup docker-compose.yml
                docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
              EOF
              exit 1
            fi
            sleep 30
          fi
        done

    - name: 📊 Update deployment status
      run: |
        echo "✅ Production deployment successful!"
        echo "🌐 Application URL: https://${{ secrets.DO_PRODUCTION_HOST }}"
        echo "📊 Monitoring: https://${{ secrets.DO_PRODUCTION_HOST }}:9090"
        echo "📝 Logs: https://${{ secrets.DO_PRODUCTION_HOST }}:3100"

  notify:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
    - name: 📧 Send Slack notification
      if: ${{ secrets.SLACK_WEBHOOK_URL }}
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 RawrZ Security Platform Deployment Status
          
          📋 Details:
          • Branch: ${{ github.ref_name }}
          • Commit: ${{ github.sha }}
          • Author: ${{ github.actor }}
          
          📊 Results:
          • Staging: ${{ needs.deploy-staging.result }}
          • Production: ${{ needs.deploy-production.result }}
          
          ${{ needs.deploy-production.result == 'success' && '✅ Production deployment successful!' || '❌ Deployment failed!' }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: 📧 Send email notification
      if: failure() && ${{ secrets.NOTIFICATION_EMAIL }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 RawrZ Security Platform - Deployment Failed"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: "GitHub Actions <noreply@github.com>"
        body: |
          The deployment of RawrZ Security Platform has failed.
          
          Details:
          - Repository: ${{ github.repository }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Author: ${{ github.actor }}
          - Workflow: ${{ github.workflow }}
          
          Please check the GitHub Actions logs for more details:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
    - name: 🗑️ Clean up old container images
      if: needs.deploy-production.result == 'success'
      run: |
        # This step would typically involve cleaning up old images from the registry
        echo "Cleanup would be performed here in a real environment"
        echo "Consider implementing registry cleanup policies"