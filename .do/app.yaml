# DigitalOcean App Platform Configuration
# Optimized for RawrZ Security Platform

name: rawrz-security-platform
region: nyc1

services:
- name: rawrz-api
  source_dir: /
  github:
    branch: main
    deploy_on_push: true
  run_command: node server.optimized.js
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  dockerfile_path: Dockerfile.optimized
  
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: LOG_LEVEL
    value: info
  - key: NODE_OPTIONS
    value: "--max-old-space-size=256"
    
  health_check:
    http_path: /health
    
  routes:
  - path: /
  
  alerts:
  - rule: CPU_UTILIZATION
    disabled: false
  - rule: MEM_UTILIZATION  
    disabled: false
  - rule: RESTART_COUNT
    disabled: false

