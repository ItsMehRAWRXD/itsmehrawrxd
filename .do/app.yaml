# Digital Ocean App Platform Specification
# App Name: orca
# This file defines the deployment configuration for Digital Ocean App Platform

name: orca
region: nyc
features:
  - buildpack-stack=ubuntu-22

services:
  - name: web
    environment_slug: node-js
    github:
      repo: ItsMehRAWRXD/itsmehrawrxd
      branch: main
      deploy_on_push: true
    
    # Build configuration
    build_command: npm ci --only=production
    run_command: node auto-server.js
    
    # Source directory
    source_dir: /
    
    # HTTP configuration
    http_port: 8080
    
    # Instance configuration
    instance_size_slug: professional-xs
    instance_count: 1
    
    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    
    # Environment variables
    envs:
      - key: NODE_ENV
        value: production
        type: GENERAL
      - key: PORT
        value: "8080"
        type: GENERAL
      - key: AUTH_TOKEN
        type: SECRET
        value: EV[2:secretKey:sensitiveData]
      - key: LOG_LEVEL
        value: info
        type: GENERAL
      - key: CORS_ORIGIN
        value: "*"
        type: GENERAL
      - key: RATE_LIMIT_WINDOW
        value: "15"
        type: GENERAL
      - key: RATE_LIMIT_MAX
        value: "100"
        type: GENERAL
    
    # Alerts
    alerts:
      - rule: DEPLOYMENT_FAILED
      - rule: DOMAIN_FAILED
      - rule: CPU_UTILIZATION
        value: 85
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        value: 85
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        value: 5
        window: FIVE_MINUTES

