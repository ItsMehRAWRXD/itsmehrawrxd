name: rawrz-app
region: nyc
services:
- name: web
  environment_slug: node-js
  build_command: npm ci --production
  run_command: node --max-old-space-size=256 server-optimized.js
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  source_dir: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8080"
  - key: NODE_OPTIONS
    value: "--max-old-space-size=256"
  health_check:
    http_path: /health
    initial_delay_seconds: 10
    period_seconds: 30
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  alerts:
  - rule: CPU_UTILIZATION
    value: 85
    window: FIVE_MINUTES
  - rule: MEM_UTILIZATION
    value: 85
    window: FIVE_MINUTES
  - rule: RESTART_COUNT
    value: 5
    window: FIVE_MINUTES