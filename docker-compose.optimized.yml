version: '3.8'

services:
  # Main RawrZ Security Platform - Optimized
  rawrz-app:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: rawrz-security-platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    # Resource limits to prevent container termination
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    # Volume mounts for persistence
    volumes:
      - rawrz_uploads:/app/uploads
      - rawrz_logs:/app/logs
    networks:
      - rawrz-network

  # Optional: Simple reverse proxy for SSL termination
  nginx:
    image: nginx:alpine
    container_name: rawrz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rawrz-app
    restart: unless-stopped
    networks:
      - rawrz-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  rawrz-network:
    driver: bridge

volumes:
  rawrz_uploads:
    driver: local
  rawrz_logs:
    driver: local