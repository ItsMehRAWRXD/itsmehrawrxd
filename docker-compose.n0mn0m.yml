version: '3.8'

services:
  # n0mn0m Quantum System - Complete Development Environment
  n0mn0m-system:
    build:
      context: .
      dockerfile: Dockerfile.n0mn0m
    container_name: n0mn0m-quantum-system
    ports:
      - "3000:3000"  # Main web interface
      - "3001:3001"  # WebSocket for real-time streaming
    volumes:
      # Mount source files for compilation
      - ./n0mn0m_final_complete.asm:/app/n0mn0m_final_complete.asm:ro
      - ./master_universal_compiler.asm:/app/master_universal_compiler.asm:ro
      - ./n0mn0m_quantum_asm_compiler.asm:/app/n0mn0m_quantum_asm_compiler.asm:ro
      - ./java_compiler_from_scratch.asm:/app/java_compiler_from_scratch.asm:ro
      - ./javascript_compiler_from_scratch.asm:/app/javascript_compiler_from_scratch.asm:ro
      # Mount logs for monitoring
      - ./logs:/app/logs
      # Mount public directory for web assets
      - ./public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WEBSOCKET_PORT=3001
      - N0MN0M_SYSTEM_MODE=production
      - QUANTUM_SIMULATION_ENABLED=true
      - UNIVERSAL_COMPILER_ENABLED=true
      - DEBUG_MODE=false
    restart: unless-stopped
    networks:
      - n0mn0m-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "n0mn0m.component=quantum-system"
      - "n0mn0m.version=2.0.0"
      - "n0mn0m.capabilities=quantum-compilation,universal-compilation,ai-scripting"

  # Optional: Monitoring and logging
  n0mn0m-monitor:
    image: prom/prometheus:latest
    container_name: n0mn0m-monitor
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - n0mn0m-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    profiles:
      - monitoring

  # Optional: Log aggregation
  n0mn0m-logs:
    image: grafana/loki:latest
    container_name: n0mn0m-logs
    ports:
      - "3100:3100"
    volumes:
      - ./logs:/app/logs:ro
      - n0mn0m_loki_data:/loki
    restart: unless-stopped
    networks:
      - n0mn0m-network
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - monitoring

networks:
  n0mn0m-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/16
          gateway: 172.20.2.1

volumes:
  n0mn0m_loki_data:
    driver: local